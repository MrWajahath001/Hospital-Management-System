<div class="register-container">
    <div class="register-card-wrapper">
        <mat-card class="register-card">
            <div class="register-header">
                <div class="logo-container">
                    <mat-icon class="hospital-icon">local_hospital</mat-icon>
                </div>
                <h1 class="system-title">Patient Registration</h1>
                <p class="system-subtitle">Create Your Patient Account</p>
            </div>

            <mat-card-content class="register-content">
                <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Full Name</mat-label>
                        <input matInput formControlName="fullName" placeholder="Enter your full name">
                        <mat-icon matPrefix>badge</mat-icon>
                        <mat-error *ngIf="registerForm.get('fullName')?.invalid">Full name is required</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Username</mat-label>
                        <input matInput formControlName="username" placeholder="Choose a username">
                        <mat-icon matPrefix>person</mat-icon>
                        <mat-error *ngIf="registerForm.get('username')?.invalid">
                            Username must be at least 3 characters
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Email</mat-label>
                        <input matInput type="email" formControlName="email" placeholder="your.email@example.com">
                        <mat-icon matPrefix>email</mat-icon>
                        <mat-error *ngIf="registerForm.get('email')?.invalid">Enter a valid email</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Password</mat-label>
                        <input matInput type="password" formControlName="password"
                            placeholder="Choose a strong password">
                        <mat-icon matPrefix>lock</mat-icon>
                        <mat-error *ngIf="registerForm.get('password')?.invalid">
                            Password must be at least 6 characters
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Contact Number</mat-label>
                        <input matInput formControlName="contactNumber" placeholder="Your phone number">
                        <mat-icon matPrefix>phone</mat-icon>
                    </mat-form-field>

                    <button mat-raised-button color="primary" type="submit" class="register-button"
                        [disabled]="loading || registerForm.invalid">
                        <span *ngIf="!loading">Register Patient</span>
                        <span *ngIf="loading">Creating Account...</span>
                    </button>
                </form>

                <div class="login-link">
                    <p>Already have an account? <a routerLink="/login">Sign In</a></p>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
